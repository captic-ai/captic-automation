[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: smoke tests - quick sanity checks
    regression: full regression suite
    ui: browser-driven end-to-end tests
    api: backend API tests
    unit: fast framework-level tests
    destructive: tests that change persistent data
    requires_test_account: tests that require dedicated non-production credentials
    prod_safe: approved for low-risk production smoke coverage
addopts = -ra -v --strict-markers
